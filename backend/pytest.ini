[pytest]
pythonpath = . ..
markers =
    integration: requires installed Blender executable
    live: requires explicitly configured live Ollama model
    ai3d_integration: independent Worker integration using labelled Mock, no neural inference
    real_ai: optional actual Hunyuan3D CUDA inference with local weights
    api_contract: cloud API contract via HTTP mock transport; no real API request
    real_api: explicit billable external API request requiring local credentials and opt-in
